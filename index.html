 <!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KofiChart - LIVE AI</title>
<style>body{margin:0;background:#0a0e1a;color:#fff;font-family:sans-serif}header{padding:12px 16px;background:#0f172a;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:22px}h1 span{color:#0ea5e9}.live{background:#0ea5e9;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:bold}#tv{height:60vh;width:100%}.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:12px}.card{background:#1e293b;padding:12px;border-radius:10px;border:1px solid #334155}.card b{display:block;font-size:11px;color:#94a3b8}.card span{font-size:18px;font-weight:bold}.buy{color:#22c55e}.box{margin:0 12px 12px;background:#1e293b;padding:14px;border-radius:10px;border:1px solid #334155}button{width:100%;padding:16px;background:#0ea5e9;border:none;border-radius:10px;color:#fff;font-weight:bold;font-size:16px;margin:12px 0}</style></head>
<body>
<header><h1>Kofi<span>Chart</span></h1><div class="live">LIVE • AI</div></header>
<div id="tv"></div>
<div class="cards">
<div class="card"><b>SIGNAL</b><span class="buy">BUY</span></div>
<div class="card"><b>CONFIDENCE</b><span>78%</span></div>
<div class="card"><b>BTC PRICE</b><span id="price">$65,420</span></div>
</div>
<div class="box"><b style="color:#22c55e">● Kofi AI Analysis</b><p style="font-size:13px;color:#cbd5e1">Analyzing market structure... BTC showing bullish momentum above $65k support. Volume increasing. AI suggests accumulation zone. Target: $69,500. Risk: 2.1% stop at $64,200</p></div>
<button onclick="alert('AI Signal: BUY BTC - 78% confidence - Target $69,500')">Generate Signal</button>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
const chart=LightweightCharts.createChart(document.getElementById('tv'),{layout:{background:{color:'#0a0e1a'},textColor:'#fff'},grid:{vertLines:{color:'#1e293b'},horzLines:{color:'#1e293b'}},width:window.innerWidth,height:window.innerHeight*0.6});
const candles=chart.addCandlestickSeries();let data=[];let base=65000;for(let i=0;i<100;i++){const o=base;const c=o+(Math.random()-0.48)*600;base=c;const h=Math.max(o,c)+Math.random()*300;const l=Math.min(o,c)-Math.random()*300;candles.setData(data);data.push({time:Math.floor(Date.now()/1000)- (100-i)*3600,open:o,high:h,low:l,close:c});}candles.setData(data);
fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd').then(r=>r.json()).then(d=>{if(d.bitcoin)document.getElementById('price').innerText='$'+d.bitcoin.usd.toLocaleString()});
setInterval(()=>{const last=data[data.length-1];const c=last.close+(Math.random()-0.5)*200;const o=last.close;const h=Math.max(o,c)+Math.random()*100;const l=Math.min(o,c)-Math.random()*100;data[data.length-1]={...last,close:c,high:Math.max(last.high,h),low:Math.min(last.low,l)};if(Math.random()>0.7){data.push({time:last.time+3600,open:c,high:h,low:l,close:c});if(data.length>100)data.shift();}candles.setData(data);},2000);
</script></body></html>
